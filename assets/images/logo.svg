<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- Outer ring -->
  <circle cx="60" cy="60" r="56" fill="none" stroke="#A88655" stroke-width="2"/>
  <!-- Inner ring -->
  <circle cx="60" cy="60" r="50" fill="none" stroke="#A88655" stroke-width="0.8" stroke-dasharray="2,2"/>

  <!-- Night sky background arc (dark fill only inside circle) -->
  <clipPath id="circleClip">
    <circle cx="60" cy="60" r="48"/>
  </clipPath>

  <!-- Stars -->
  <g fill="#A88655" opacity="0.8">
    <circle cx="30" cy="30" r="0.8"/>
    <circle cx="45" cy="22" r="0.5"/>
    <circle cx="80" cy="26" r="0.8"/>
    <circle cx="95" cy="35" r="0.5"/>
    <circle cx="22" cy="50" r="0.5"/>
    <circle cx="98" cy="55" r="0.6"/>
    <circle cx="38" cy="40" r="0.4"/>
    <circle cx="88" cy="40" r="0.4"/>
  </g>

  <!-- Crescent moon top right -->
  <g transform="translate(83, 28)">
    <path d="M6 0 A6 6 0 1 0 6 12 A4 4 0 1 1 6 0 Z" fill="#A88655"/>
  </g>

  <!-- Mountain range - back large -->
  <polygon points="60,20 35,62 85,62" fill="#6B5B3E" opacity="0.7"/>
  <!-- Mountain range - left -->
  <polygon points="42,38 18,62 65,62" fill="#5A4D38" opacity="0.8"/>
  <!-- Mountain range - right -->
  <polygon points="78,42 55,62 102,62" fill="#5A4D38" opacity="0.8"/>
  <!-- Snow cap on main mountain -->
  <polygon points="60,20 54,34 66,34" fill="#E8DCC8" opacity="0.9"/>

  <!-- Ground / horizon band -->
  <rect x="12" y="62" width="96" height="6" rx="1" fill="#A88655" opacity="0.4"/>

  <!-- Pine trees -->
  <!-- Left group -->
  <g fill="#2D6A4F">
    <polygon points="26,62 22,54 30,54"/>
    <polygon points="26,56 23,50 29,50"/>
    <rect x="25" y="62" width="2" height="3" fill="#6B5B3E"/>
  </g>
  <g fill="#2D6A4F">
    <polygon points="37,62 33,53 41,53"/>
    <polygon points="37,55 34,49 40,49"/>
    <rect x="36" y="62" width="2" height="3" fill="#6B5B3E"/>
  </g>
  <!-- Right group -->
  <g fill="#2D6A4F">
    <polygon points="83,62 79,53 87,53"/>
    <polygon points="83,55 80,49 86,49"/>
    <rect x="82" y="62" width="2" height="3" fill="#6B5B3E"/>
  </g>
  <g fill="#2D6A4F">
    <polygon points="94,62 90,54 98,54"/>
    <polygon points="94,56 91,50 97,50"/>
    <rect x="93" y="62" width="2" height="3" fill="#6B5B3E"/>
  </g>

  <!-- Small cabin -->
  <rect x="54" y="55" width="12" height="8" fill="#8B6914"/>
  <polygon points="54,55 66,55 60,50" fill="#6B5B3E"/>
  <rect x="58" y="59" width="4" height="4" fill="#E8DCC8" opacity="0.7"/>

  <!-- Bottom arc text: EST · 2014 · NATURE VALLEY -->
  <path id="bottomArc" d="M 14,60 A 46,46 0 0,0 106,60" fill="none"/>
  <text font-size="5" font-family="'Inter', sans-serif" font-weight="700" letter-spacing="1.5" fill="#A88655" text-anchor="middle">
    <textPath href="#bottomArc" startOffset="50%">EST · 2014 · NATURE VALLEY</textPath>
  </text>

  <!-- Top arc text: BOUTIQUE · HOTEL -->
  <path id="topArc" d="M 16,60 A 44,44 0 0,1 104,60" fill="none"/>
  <text font-size="5.5" font-family="'Inter', sans-serif" font-weight="700" letter-spacing="2" fill="#A88655" text-anchor="middle">
    <textPath href="#topArc" startOffset="50%">BOUTIQUE · HOTEL</textPath>
  </text>

  <!-- Butterfly / leaf icon top center -->
  <g transform="translate(57,10)" fill="#2D6A4F">
    <ellipse cx="-2" cy="0" rx="2.5" ry="1.5" transform="rotate(-30,-2,0)"/>
    <ellipse cx="2" cy="0" rx="2.5" ry="1.5" transform="rotate(30,2,0)"/>
    <rect x="-0.4" y="-2" width="0.8" height="4" rx="0.4"/>
  </g>

  <!-- HAVEN text -->
  <text x="60" y="43" font-size="11" font-family="'Playfair Display', Georgia, serif" font-weight="700" fill="#E8DCC8" text-anchor="middle" letter-spacing="2">HAVEN</text>

  <!-- Retreat italic text -->
  <text x="60" y="52" font-size="6.5" font-family="'Playfair Display', Georgia, serif" font-style="italic" fill="#A88655" text-anchor="middle" letter-spacing="1">Retreat</text>

  <!-- Divider line under Retreat -->
  <line x1="48" y1="54.5" x2="72" y2="54.5" stroke="#A88655" stroke-width="0.5" opacity="0.7"/>
</svg>
